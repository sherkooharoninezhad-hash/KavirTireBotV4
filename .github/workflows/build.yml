
name: Build KavirTireBotV4

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pyinstaller

      - name: Build Windows EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name KavirTireBotV4 --collect-all playwright --collect-all greenlet --collect-all pyee kavir_tire_bot.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: KavirTireBotV4-Windows
          path: dist/KavirTireBotV4.exe
